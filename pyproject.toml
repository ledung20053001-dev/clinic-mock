[project]
name = "clinic-mock"
version = "1.0.0"
description = "Public-API mock for clinic platform testing."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langfuse>=4.15.2",
    "loguru>=0.7.3",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
dev = "clinic_mock.main:run_dev"
prod = "clinic_mock.main:run_prod"

[tool.uv.build-backend]
module-root = "src"
module-name = "clinic_mock"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
