openapi: 3.1.0
info:
  title: Clinic Platform API
  version: '1.0.0'
  summary: AI-callbot clinic mock — appointment and discovery endpoints per the AI Health Residency product contract (Rev 1.0).
  description: |
    Authoritative human-readable spec: ../docs/APIs.md.
    This file is the machine-readable companion and is the source of truth for client tooling.

    Surface matches contract §4.2 — `GET /patients`, `GET /slots`, `POST /appointments`,
    `GET /appointments/{id}`, `GET /appointments`, `POST /appointments/{id}/{confirm|cancel|transfer|reschedule|unreachable}`.
    The /v1/calls/* endpoints (bot-side per §4.1) are intentionally absent.
  contact:
    email: api-support@clinic.example
  license:
    name: Proprietary
servers:
  - url: https://api.clinic.example/v1
    description: Production
  - url: https://sandbox.api.clinic.example/v1
    description: Sandbox
security:
  - bearerAuth: []
tags:
  - name: Discovery
    description: Patient and slot lookup.
  - name: Appointments
    description: Booking, reading, and lifecycle management.
  - name: Admin
    description: Tenant-scoped scoring-harness endpoints. Requires a bearer key.
  - name: Health
    description: Liveness probe. No auth required.

paths:
  /health:
    get:
      tags: [Health]
      operationId: healthCheck
      summary: Liveness probe.
      security: []
      responses:
        '200':
          description: Service is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                required: [status]

  /v1/patients:
    get:
      tags: [Discovery]
      operationId: findPatients
      summary: Find patients by phone (used for inbound identity verification).
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: phone
          required: true
          schema:
            type: string
            pattern: '^(02|03|05|07|08|09)\d{8}$'
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: Paginated list of patients matching the phone.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PatientPage' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/BadKey' }

  /v1/slots:
    get:
      tags: [Discovery]
      operationId: listOpenSlots
      summary: List genuinely open, bookable slots for a clinic in a time window.
      description: |
        This is the **only** legal source for presenting availability to a caller (contract §1.1.6).
        Times are RFC 3339 with either `Z` or `±HH:MM` offset (Listing 3 uses `+07:00`).
      security:
        - bearerAuth: []
      parameters:
        - { in: query, name: clinic_id, required: true, schema: { type: string } }
        - { in: query, name: from, required: true, schema: { type: string, format: date-time } }
        - { in: query, name: to, required: true, schema: { type: string, format: date-time } }
        - { in: query, name: cursor, schema: { type: string } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: Paginated list of slots.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SlotPage' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/BadKey' }

  /v1/appointments:
    post:
      tags: [Appointments]
      operationId: createAppointment
      summary: Book an appointment (§1.1.10 inbound booking).
      description: |
        Creates one appointment from a `patient_id` + `slot_id` pair. The slot is
        consumed atomically; subsequent attempts to book the same slot return 404.
        Result `status` is `BOOKED`, `version` starts at 1, `attempt_count` at 0.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppointmentCreate' }
      responses:
        '201':
          description: Appointment created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appointment' }
          headers:
            Idempotent-Replayed:
              description: "'true' when this response was served from the idempotency cache."
              schema: { type: string, enum: ['true'] }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/BadKey' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/IdempotencyConflict' }
    get:
      tags: [Appointments]
      operationId: listAppointments
      summary: List appointments for a clinic on a given date (call list).
      security:
        - bearerAuth: []
      parameters:
        - { in: query, name: date, required: true, schema: { type: string, format: date, example: '2026-10-14' } }
        - { in: query, name: clinic_id, required: true, schema: { type: string } }
        - { in: query, name: cursor, schema: { type: string } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: Paginated list of appointments.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppointmentPage' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/BadKey' }

  /v1/appointments/{appt_id}:
    get:
      tags: [Appointments]
      operationId: getAppointment
      summary: Read a single appointment (Listing 3 canonical shape).
      security:
        - bearerAuth: []
      parameters:
        - { in: path, name: appt_id, required: true, schema: { type: string } }
      responses:
        '200':
          description: The appointment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appointment' }
        '401': { $ref: '#/components/responses/BadKey' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/appointments/{appt_id}/confirm:
    post:
      tags: [Appointments]
      operationId: confirmAppointment
      summary: §1.1.3 — set status=CONFIRMED after the patient agrees to the read-back.
      description: Sets `confirmed_at` and `confirmed_via=callbot` and bumps `version`.
      security:
        - bearerAuth: []
      parameters:
        - { in: path, name: appt_id, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Updated appointment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appointment' }
        '401': { $ref: '#/components/responses/BadKey' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/IdempotencyConflict' }

  /v1/appointments/{appt_id}/cancel:
    post:
      tags: [Appointments]
      operationId: cancelAppointment
      summary: §1.1.4 / §3.5 SF-05 — record a cancellation with the patient's explicit second confirmation.
      description: |
        Requires `confirmed: true` in the body. Without it the mock returns
        409 `CONFIRMATION_REQUIRED` (a single ambiguous turn is not enough).
      security:
        - bearerAuth: []
      parameters:
        - { in: path, name: appt_id, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelRequest' }
      responses:
        '200':
          description: Updated appointment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appointment' }
        '401': { $ref: '#/components/responses/BadKey' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            Either `If-Match` mismatch (`VERSION_CONFLICT`), the cancel
            was missing the explicit second confirmation (`CONFIRMATION_REQUIRED`),
            or the appointment is in a state that cannot be cancelled
            (`INVALID_STATE_TRANSITION`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '422': { $ref: '#/components/responses/IdempotencyConflict' }

  /v1/appointments/{appt_id}/transfer:
    post:
      tags: [Appointments]
      operationId: transferAppointment
      summary: §1.1.5 — set status=TRANSFERRED with a reason from Appendix A.
      security:
        - bearerAuth: []
      parameters:
        - { in: path, name: appt_id, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferRequest' }
      responses:
        '200':
          description: Updated appointment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appointment' }
        '401': { $ref: '#/components/responses/BadKey' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/IdempotencyConflict' }

  /v1/appointments/{appt_id}/reschedule:
    post:
      tags: [Appointments]
      operationId: rescheduleAppointment
      summary: §1.1.6 / Listing 4 — atomically book the new slot and release the old one.
      description: |
        Response shape is the **minimal Listing 4 form**: `{status, new_slot_id,
        released_slot_id, version}` — not the full appointment. The old slot is
        re-inserted into the slot pool under its original `slot_id`; the new slot
        is consumed.
      security:
        - bearerAuth: []
      parameters:
        - { in: path, name: appt_id, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RescheduleRequest' }
      responses:
        '200':
          description: Listing 4 minimal response.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RescheduleResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/BadKey' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`SLOT_TAKEN` if `new_slot_id` is no longer open, `VERSION_CONFLICT` if `If-Match` mismatches, or `INVALID_STATE_TRANSITION`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '422': { $ref: '#/components/responses/IdempotencyConflict' }

  /v1/appointments/{appt_id}/unreachable:
    post:
      tags: [Appointments]
      operationId: markUnreachable
      summary: §1.1.7 / §2.2 — mark the appointment UNREACHABLE (no answer / voicemail / silent).
      description: |
        Idempotent: each call increments `attempt_count` and re-confirms
        `UNREACHABLE`, so the harness can record multiple no-answer attempts on
        the same appointment. Allowed from `{SCHEDULED, BOOKED, UNREACHABLE}`.
      security:
        - bearerAuth: []
      parameters:
        - { in: path, name: appt_id, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Updated appointment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appointment' }
        '401': { $ref: '#/components/responses/BadKey' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }

  /_harness/state:
    get:
      tags: [Admin]
      operationId: harnessState
      summary: Full per-tenant state snapshot (patients + slots + appointments).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Caller's data scope.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HarnessState' }
        '401': { $ref: '#/components/responses/BadKey' }

  /_harness/writelog:
    get:
      tags: [Admin]
      operationId: harnessWritelog
      summary: Append-only log of every /v1/* mutation since the last reset (§4.3 step 5).
      description: |
        The scoring harness reads this to detect SF-01 (write to wrong appointment
        — check `appointment_id`), SF-02 (offer slot not returned by /v1/slots —
        check the `slot_id` in each `create_appointment` entry against prior
        /v1/slots responses), and SF-05 (cancel without the second confirmation —
        visible as a 409 `CONFIRMATION_REQUIRED` entry). Captures the request body,
        response status, If-Match, and Idempotency-Key for each /v1/* write.
      security:
        - bearerAuth: []
      parameters:
        - { in: query, name: op, schema: { type: string }, description: 'Filter by op label (create_appointment, confirm, cancel, transfer, reschedule, unreachable).' }
        - { in: query, name: appointment_id, schema: { type: string }, description: 'Filter by affected appointment id (e.g. SF-01 detection).' }
        - { in: query, name: since, schema: { type: string, format: date-time }, description: 'Inclusive lower bound on entry `at` (ISO 8601). Used to scope a query to one test''s time window.' }
        - { in: query, name: until, schema: { type: string, format: date-time }, description: 'Inclusive upper bound on entry `at` (ISO 8601).' }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 10000, default: 1000 } }
      responses:
        '200':
          description: Writelog entries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WriteLogResponse' }
        '401': { $ref: '#/components/responses/BadKey' }

  /_harness/patients:
    get:
      tags: [Admin]
      operationId: harnessPatients
      summary: Patients in the caller's data scope (own + canonical contract fixtures).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Array of patients.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Patient' }
        '401': { $ref: '#/components/responses/BadKey' }
    post:
      tags: [Admin]
      operationId: createPatient
      summary: Create a patient in the caller's tenant scope (scaffolding).
      description: |
        Server generates `patient_id`. Canonical contract fixtures are
        read-only — this endpoint always assigns a new id under the caller's
        tenant, so it can never collide with `pt_3391` etc.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PatientCreate' }
      responses:
        '201':
          description: Patient created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Patient' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/BadKey' }

  /_harness/patients/{patient_id}:
    parameters:
      - { in: path, name: patient_id, required: true, schema: { type: string } }
    patch:
      tags: [Admin]
      operationId: updatePatient
      summary: Partially update a patient (scaffolding).
      description: |
        All fields optional. Canonical fixtures are hidden (`404 NOT_FOUND`)
        to match the read-side isolation semantics. Updateable only inside
        the caller's tenant scope.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PatientUpdate' }
      responses:
        '200':
          description: Updated patient.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Patient' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/BadKey' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Admin]
      operationId: deletePatient
      summary: Delete a patient from the caller's tenant scope (scaffolding).
      description: |
        Canonical contract fixtures are hidden (`404 NOT_FOUND`). Appointments
        referencing a deleted patient are NOT cascaded — the caller must delete
        or reschedule them first if that's the intent.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: { type: string }
        '401': { $ref: '#/components/responses/BadKey' }
        '404': { $ref: '#/components/responses/NotFound' }

  /_harness/slots:
    get:
      tags: [Admin]
      operationId: harnessSlots
      summary: Slots in the caller's data scope.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Array of slots.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Slot' }
        '401': { $ref: '#/components/responses/BadKey' }

  /_harness/appointments:
    get:
      tags: [Admin]
      operationId: harnessAppointments
      summary: Appointments in the caller's data scope.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Array of appointments.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Appointment' }
        '401': { $ref: '#/components/responses/BadKey' }

  /_harness/snapshot:
    get:
      tags: [Admin]
      operationId: harnessSnapshotList
      summary: List the caller's tenant's snapshots, optionally bounded by `since`/`until`.
      security:
        - bearerAuth: []
      parameters:
        - { in: query, name: since, schema: { type: string, format: date-time }, description: 'Inclusive lower bound on snapshot `created_at` (ISO 8601).' }
        - { in: query, name: until, schema: { type: string, format: date-time }, description: 'Inclusive upper bound on snapshot `created_at` (ISO 8601).' }
      responses:
        '200':
          description: Caller's snapshots.
          content:
            application/json:
              schema:
                type: object
                required: [snapshots, count]
                properties:
                  snapshots:
                    type: array
                    items:
                      type: object
                      required: [snapshot_id, created_at]
                      properties:
                        snapshot_id: { type: string }
                        created_at: { type: string, format: date-time }
                  count: { type: integer }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/BadKey' }
    post:
      tags: [Admin]
      operationId: harnessSnapshot
      summary: Capture a state snapshot for later restore.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Snapshot id.
          content:
            application/json:
              schema:
                type: object
                properties:
                  snapshot_id: { type: string }
                required: [snapshot_id]
        '401': { $ref: '#/components/responses/BadKey' }

  /_harness/snapshot/{sid}:
    parameters:
      - { in: path, name: sid, required: true, schema: { type: string } }
    get:
      tags: [Admin]
      operationId: harnessSnapshotRead
      summary: Read a captured snapshot. Tenant-scoped.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The snapshot.
          content:
            application/json:
              schema:
                type: object
                required: [snapshot_id, created_at, patients, slots, appointments, writelog]
                properties:
                  snapshot_id: { type: string }
                  created_at: { type: string, format: date-time }
                  patients:
                    type: array
                    items: { $ref: '#/components/schemas/Patient' }
                  slots:
                    type: array
                    items: { $ref: '#/components/schemas/Slot' }
                  appointments:
                    type: array
                    items: { $ref: '#/components/schemas/Appointment' }
                  writelog:
                    type: array
                    items: { $ref: '#/components/schemas/WriteLogEntry' }
                  system_clock_offset_sec: { type: integer }
        '401': { $ref: '#/components/responses/BadKey' }
        '404': { $ref: '#/components/responses/NotFound' }

  /_harness/snapshot/{sid}/restore:
    post:
      tags: [Admin]
      operationId: harnessSnapshotRestore
      summary: Restore state from a prior snapshot.
      security:
        - bearerAuth: []
      parameters:
        - { in: path, name: sid, required: true, schema: { type: string } }
      responses:
        '200':
          description: Snapshot restored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  restored: { type: string }
                required: [restored]
        '401': { $ref: '#/components/responses/BadKey' }
        '404': { $ref: '#/components/responses/NotFound' }

  /_harness/seed:
    post:
      tags: [Admin]
      operationId: harnessSeed
      summary: Reset and seed canonical fixtures.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Seeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  seeded: { type: boolean, enum: [true] }
                required: [seeded]
        '401': { $ref: '#/components/responses/BadKey' }

  /_harness/reset:
    post:
      tags: [Admin]
      operationId: harnessReset
      summary: Reset and re-seed (used between cases).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Reset.
          content:
            application/json:
              schema:
                type: object
                properties:
                  reset: { type: boolean, enum: [true] }
                required: [reset]
        '401': { $ref: '#/components/responses/BadKey' }

  /_harness/time-travel:
    post:
      tags: [Admin]
      operationId: harnessTimeTravel
      summary: Advance the system clock by `seconds` (positive or negative).
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                seconds: { type: integer, default: 0 }
      responses:
        '200':
          description: New clock offset.
          content:
            application/json:
              schema:
                type: object
                properties:
                  offset_seconds: { type: integer }
                required: [offset_seconds]
        '401': { $ref: '#/components/responses/BadKey' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    IfMatch:
      in: header
      name: If-Match
      required: false
      schema: { type: integer, minimum: 1 }
      description: 'Contract §4.2.3 — last-read appointment version (SHOULD on writes).'
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      schema: { type: string, maxLength: 255 }
      description: 'Contract §4.2.3 — stable per-key replay token (MUST on writes). 24h cache window.'
  responses:
    InvalidRequest:
      description: '400 INVALID_REQUEST — request body or query failed validation.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    BadKey:
      description: '401 BAD_KEY — bearer token missing, malformed, or unknown.'
      headers:
        WWW-Authenticate:
          schema: { type: string, example: 'Bearer realm="clinic-mock"' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    NotFound:
      description: '404 NOT_FOUND — resource does not exist or is not visible to the caller.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    VersionConflict:
      description: '409 VERSION_CONFLICT — `If-Match` header does not match the current version.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    IdempotencyConflict:
      description: '422 IDEMPOTENCY_CONFLICT — same `Idempotency-Key` reused with a different payload.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
  schemas:
    PatientVerify:
      type: object
      description: Identity block the bot checks against the caller's spoken name + dob.
      required: [full_name, dob]
      properties:
        full_name: { type: string }
        dob: { type: string, format: date, example: '1978-03-14' }
    Patient:
      type: object
      required: [patient_id, display_name, phone, dob]
      properties:
        patient_id: { type: string, example: pt_3391 }
        display_name: { type: string, example: 'N. V. A.', description: 'Initials-style label the bot speaks aloud.' }
        phone: { type: string, pattern: '^(02|03|05|07|08|09)\d{8}$' }
        dob: { type: string, format: date }
        verify: { $ref: '#/components/schemas/PatientVerify' }
    PatientRef:
      type: object
      description: Listing 3 — embedded patient block inside an Appointment.
      required: [patient_id, display_name, verify]
      properties:
        patient_id: { type: string }
        display_name: { type: string }
        verify: { $ref: '#/components/schemas/PatientVerify' }
    PatientPage:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Patient' }
        next_cursor: { type: [string, 'null'] }
        has_more: { type: boolean }
    PatientCreate:
      type: object
      description: 'Body for `POST /_harness/patients` — server generates `patient_id`.'
      required: [display_name, phone, dob]
      properties:
        display_name: { type: string }
        phone: { type: string, pattern: '^(02|03|05|07|08|09)\d{8}$' }
        dob: { type: string, format: date }
        verify: { $ref: '#/components/schemas/PatientVerify' }
    PatientUpdate:
      type: object
      description: 'Body for `PATCH /_harness/patients/{id}` — all fields optional.'
      properties:
        display_name: { type: string }
        phone: { type: string, pattern: '^(02|03|05|07|08|09)\d{8}$' }
        dob: { type: string, format: date }
        verify: { $ref: '#/components/schemas/PatientVerify' }
    Slot:
      type: object
      required: [slot_id, clinic_id, start_time, end_time, provider_id]
      properties:
        slot_id: { type: string, example: slot_91d2 }
        clinic_id: { type: string, example: cl_vinmec }
        start_time: { type: string, format: date-time, example: '2026-10-14T15:00:00+07:00' }
        end_time: { type: string, format: date-time }
        provider_id: { type: string }
    SlotPage:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Slot' }
        next_cursor: { type: [string, 'null'] }
        has_more: { type: boolean }
    AppointmentStatus:
      type: string
      description: Contract §2.2 — the seven end states.
      enum: [SCHEDULED, BOOKED, CONFIRMED, CANCELLED, RESCHEDULED, TRANSFERRED, UNREACHABLE]
    CancelReason:
      type: string
      description: 'Appendix A — cancel_reason enumeration.'
      enum: [PATIENT_UNAVAILABLE, NO_LONGER_NEEDED, WENT_ELSEWHERE, COST, UNSPECIFIED]
    TransferReason:
      type: string
      description: 'Appendix A — transfer_reason enumeration.'
      enum: [IDENTITY_FAILED, PATIENT_NOT_FOUND, OUT_OF_SCOPE, CLINICAL_QUESTION, NOT_UNDERSTOOD, PATIENT_REQUEST, SYSTEM_ERROR]
    Appointment:
      type: object
      description: Contract Listing 3 — canonical GET /appointments/{id} response.
      required:
        - appointment_id
        - status
        - clinic_id
        - starts_at
        - ends_at
        - department
        - patient
        - attempt_count
        - version
      properties:
        appointment_id: { type: string, example: apt_00417 }
        status: { $ref: '#/components/schemas/AppointmentStatus' }
        clinic_id: { type: string, example: cl_vinmec }
        starts_at: { type: string, format: date-time, example: '2026-10-14T15:30:00+07:00' }
        ends_at: { type: string, format: date-time }
        department: { type: string, example: 'Nội tổng quát' }
        patient: { $ref: '#/components/schemas/PatientRef' }
        cancel_reason:
          oneOf:
            - $ref: '#/components/schemas/CancelReason'
            - type: 'null'
        transfer_reason:
          oneOf:
            - $ref: '#/components/schemas/TransferReason'
            - type: 'null'
        confirmed_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        confirmed_via:
          oneOf:
            - type: string
            - type: 'null'
          description: Set to "callbot" on CONFIRMED.
        new_slot_id:
          oneOf:
            - type: string
            - type: 'null'
          description: Audit trail of the slot picked on reschedule.
        attempt_count: { type: integer, minimum: 0 }
        version: { type: integer, minimum: 1, example: 3 }
    AppointmentPage:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Appointment' }
        next_cursor: { type: [string, 'null'] }
        has_more: { type: boolean }
    AppointmentCreate:
      type: object
      required: [patient_id, slot_id]
      properties:
        patient_id: { type: string }
        slot_id: { type: string }
    CancelRequest:
      type: object
      description: '§3.5 SF-05 — `confirmed` is the second explicit confirmation from the patient.'
      required: [cancel_reason, confirmed]
      properties:
        cancel_reason: { $ref: '#/components/schemas/CancelReason' }
        confirmed: { type: boolean, default: false }
    TransferRequest:
      type: object
      required: [transfer_reason]
      properties:
        transfer_reason: { $ref: '#/components/schemas/TransferReason' }
    RescheduleRequest:
      type: object
      description: Contract Listing 4 request body.
      required: [new_slot_id, requested_by]
      properties:
        new_slot_id: { type: string, example: slot_91d2 }
        requested_by:
          type: string
          enum: [PATIENT, STAFF]
    RescheduleResponse:
      type: object
      description: Contract Listing 4 minimal response (NOT the full appointment).
      required: [status, new_slot_id, released_slot_id, version]
      properties:
        status:
          type: string
          enum: [RESCHEDULED]
        new_slot_id: { type: string }
        released_slot_id: { type: string }
        version: { type: integer, minimum: 2 }
    HarnessState:
      type: object
      required: [patients, slots, appointments]
      properties:
        patients:
          type: array
          items: { $ref: '#/components/schemas/Patient' }
        slots:
          type: array
          items: { $ref: '#/components/schemas/Slot' }
        appointments:
          type: array
          items: { $ref: '#/components/schemas/Appointment' }
    WriteLogEntry:
      type: object
      description: 'One /v1/* request the mock captured (§4.3 step 5 — writes + slot lists).'
      required: [at, op, method, path, status]
      properties:
        at: { type: string, format: date-time }
        op:
          type: string
          enum:
            - list_slots
            - find_patients
            - get_appointment
            - list_appointments
            - create_appointment
            - confirm
            - cancel
            - transfer
            - reschedule
            - unreachable
        method: { type: string, enum: [GET, POST, PATCH, PUT, DELETE] }
        path: { type: string }
        status: { type: integer }
        body:
          description: |
            For writes (POST/PATCH/PUT/DELETE): the parsed request body.
            For reads (GET): the parsed response body (the slot list the bot
            was served, the patient record fetched, etc.). Null if empty or
            not JSON.
          oneOf:
            - type: object
            - type: 'null'
        if_match: { type: integer }
        idempotency_key: { type: string }
        appointment_id: { type: string }
    WriteLogResponse:
      type: object
      required: [entries, count, truncated]
      properties:
        entries:
          type: array
          items: { $ref: '#/components/schemas/WriteLogEntry' }
        count: { type: integer, description: 'Total entries matching the filter.' }
        truncated:
          type: boolean
          description: 'True when count > limit (more entries exist beyond the returned page).'
    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
              description: 'Appendix A catalog: `INVALID_REQUEST` (400), `BAD_KEY` (401), `NOT_FOUND` (404), `SLOT_TAKEN` / `VERSION_CONFLICT` / `CONFIRMATION_REQUIRED` / `INVALID_STATE_TRANSITION` (409), `RATE_LIMITED` (429, reserved), `UPSTREAM` (503, reserved).'
            message: { type: string }
            request_id: { type: string }
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  issue: { type: string }
                  value: {}
